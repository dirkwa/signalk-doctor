<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SignalK Doctor">
  <!--
    SignalK Doctor app icon.
    Original artwork by Dirk Wahrheit, contributed under Apache-2.0 along
    with the rest of the signalk-doctor repository. Free to redistribute
    by the Signal K project and its appstore without further attribution.

    Design intent:
      - Background gradient is sea-green / teal (the "healthy water" palette
        that pairs with the blue updater icon without colliding with it).
      - Heart-pulse / EKG trace = diagnostic intent, the doctor's job.
      - Cross at the right = medical / triage symbol, balances the trace.
      - Single-color foreground keeps the icon legible at favicon size.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa17a"/>
      <stop offset="1" stop-color="#0b5d47"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- EKG / heart-pulse trace running left -> right, with a heartbeat spike in the middle -->
  <path d="M 16 64
           L 40 64
           L 48 50
           L 56 84
           L 64 40
           L 72 78
           L 80 64
           L 96 64"
        stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Medical cross anchored on the right baseline -->
  <g fill="#ffffff">
    <rect x="100" y="50"  width="10" height="28" rx="2"/>
    <rect x="91"  y="59"  width="28" height="10" rx="2"/>
  </g>
</svg>
