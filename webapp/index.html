<!doctype html>
<!--
  Vite requires an entry module to build the federation remote — this
  file is that entry. The intended access path is via the SignalK admin
  at /admin/#/e/Doctor, which loads /signalk-doctor/remoteEntry.js and
  renders AppPanel inside the admin shell with all the host context
  (adminUI, share scope React) AppPanel needs.

  Direct navigation to /signalk-doctor/ will load this page and execute
  the AppPanel script, but without the admin host the panel will hit
  errors on first render (no adminUI prop, host-shared React unavailable).
  The standalone-redirect approach this plugin used pre-0.3.0 is gone;
  the way to reach the Doctor Console is through the admin tile.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SignalK Doctor (remote entry)</title>
  </head>
  <body>
    <noscript>This page is a Module Federation remote and requires JavaScript.</noscript>
    <p>
      Open the Doctor Console from the SignalK admin UI instead — click the
      <em>Doctor</em> tile in the Webapps grid, or browse to <code>/admin/#/e/Doctor</code>.
    </p>
    <script type="module" src="./src/AppPanel.tsx"></script>
  </body>
</html>
